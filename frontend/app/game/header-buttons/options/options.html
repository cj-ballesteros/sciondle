@if (open) {
  <div class="fixed inset-0 z-50 bg-black/50" role="dialog" aria-modal="true" (click)="close()"
  >
    <div
      class="absolute inset-0"
      animate.enter="backdrop-enter"
      animate.leave="backdrop-leave"
    ></div>
    <div class="relative flex min-h-full items-center justify-center p-4">
      <div
        #panel
        tabindex="-1"
        class="flex max-h-[85vh] w-[min(92vw,760px)]
        flex-col overflow-hidden rounded-xl
        bg-[#2b2b2b] shadow-2xl outline-none"
        cdkTrapFocus
        [cdkTrapFocusAutoCapture]="true"
        animate.enter="panel-enter"
        animate.leave="panel-leave"
        (click)="$event.stopPropagation()"
      >
        <div class="relative bg-gradient-to-b from-[#4a4a4a] to-[#2f2f2f] px-3 pt-2">
          <div class="flex items-center justify-between gap-4">
            <div>
              <h2 class="text-xl tracking-wide text-[#e7e7e7]">
                Options
              </h2>
            </div>

            <button
              type="button"
              class="rounded-md px-1 text-2xl leading-none text-white/80 hover:bg-white/10 hover:text-white focus:outline-none focus:ring-2 focus:ring-white/30"
              (click)="close()"
              aria-label="Close"
            >
              ×
            </button>
          </div>
          <div class="mt-2 h-px w-[calc(100%-0.5rem)] bg-white/15"></div>
        </div>

        <div class="flex-1 overflow-y-auto bg-[#2f2f2f] p-6">
          <div class="flex items-center justify-between gap-4">
            <span class="text-[#D0D0D0] text-lg">Colorblind Mode</span>
            <button
              title="Colorblind Mode"
              type="button"
              role="switch"
              [attr.aria-checked]="colorblindMode.getMode()"
              (click)="colorblindMode.toggleColorblind(); $event.stopPropagation()"
              class="
              relative h-7 w-14 rounded-full border border-white/20
              bg-gradient-to-b
              shadow-[inset_0_1px_0_rgba(255,255,255,0.18),_0_2px_3px_rgba(0,0,0,0.5)]
              transition"
              [class.bg-gradient-to-b]="true"
              [class.from-[#5a5a5a]]="!colorblindMode.getMode()"
              [class.to-[#3a3a3a]]="!colorblindMode.getMode()"
              [class.border-white]="!colorblindMode.getMode()"
              [class.from-blue-500]="colorblindMode.getMode()"
              [class.to-blue-700]="colorblindMode.getMode()"
              [class.border-blue-400]="colorblindMode.getMode()"
            >
              <span
                class="absolute top-1 left-1 h-5 w-5 rounded-full bg-white
                       transition-all duration-200"
                [class.left-8]="colorblindMode.getMode()"
              ></span>
            </button>
          </div>
        </div>
        <div class="shrink-0 border-t border-white/10 bg-[#2b2b2b] px-6 py-4 flex justify-end">
          <button
            (click)="close()"
            class="
              rounded-3xl
              border border-white/20
              bg-gradient-to-b from-[#5a5a5a] to-[#3a3a3a]
              px-8 py-1
              text-sm font-semibold tracking-wide text-[#e7e7e7]
              shadow-[inset_0_1px_0_rgba(255,255,255,0.25),_0_2px_4px_rgba(0,0,0,0.4)]
              hover:from-[#6a6a6a] hover:to-[#4a4a4a]
              active:translate-y-px
              active:shadow-[inset_0_2px_2px_rgba(0,0,0,0.5)]
              focus:outline-none
              focus:ring-2 focus:ring-white/30
            "
          >
            Close
          </button>
        </div>
      </div>
    </div>
  </div>
}
