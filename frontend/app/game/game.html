<div class="welcome-wrapper">
  <div
    class="relative min-w-1xl w-[85%] max-w-3xl aspect-[1341/310]
           mx-auto
           bg-[url('app/assets/textbox_template.png')] bg-contain bg-no-repeat bg-center
           flex items-center justify-center px-6"
  >
    <div
      class="absolute left-[12%] top-0 h-[32.5%] flex items-center
              text-white drop-shadow-[1px_1px_1px_rgba(255,255,255,0.6)]"
      style="font-size: min(2.5vw, 20px);"
    >
      Welcome to XIVdle!
    </div>

    <!-- Centered Dialogue Text -->
    <p class="absolute left-[10%] h-[35%] text-gray-900 leading-tight"
       style="font-size: min(2.5vw, 20px);">
      Guess today's XIV character!<br/>
      Enter your guess to get started!
    </p>
  </div>
</div>
<app-header-buttons/>

<p class="relative mx-auto mt-3 w-fit rounded-full
         px-4 py-1.5
         font-medium
         text-center text-gray
         shadow-sm ring-1 ring-black/10"
   style="font-size: min(2.5vw, 18px); background: #e7dfca; opacity: 0.9" >
  Yesterday's character was <span class="text-red-600">{{ getPreviousDayAnswer().name }}</span>
</p>

@if (!game_over){
  <app-searchjson (characterSelected)="onCharacterSelected($event)"/>
}
@if (guesses && guesses.length > 0) {
  <app-guess-table [guesses]="guesses"/>
}
@if (game_over && correctAnswer) {
  <app-results [correctAnswer]="correctAnswer" [guesses]="guesses"/>
  <app-share [guesses]="guesses"/>
}
