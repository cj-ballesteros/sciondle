<div class="welcome-wrapper">
  <div
    class="relative min-w-1xl w-[85%] max-w-3xl aspect-[1341/310]
           mx-auto
           bg-[url('app/assets/textbox_template.png')] bg-contain bg-no-repeat bg-center
           flex items-center justify-center px-6"
  >
    <div
      class="absolute left-[12%] top-0 h-[32.5%] flex items-center
              text-white drop-shadow-[1px_1px_1px_rgba(255,255,255,0.6)]"
      style="font-size: min(2.5vw, 20px);"
    >
      Welcome to XIVdle!
    </div>

    <p class="absolute left-[10%] h-[35%] text-gray-900 leading-tight"
       style="font-size: min(2.5vw, 20px);">
      Choose a gamemode to get started!<br/>
      Game updates everyday at 9pm PST.
    </p>
  </div>
</div>

<div class="game-modes-container">
  <div class="classic-mode-row">
    <button class="game-mode-item classic-mode-item" type="button"
            (click)="modeSelected.emit('daily')">
      <div class="mode-image-wrap">
        <img src="main_commands/03_MainCommands/01/character.png"
             class="mode-image" height="48" width="48" alt="" />
      </div>
      <div class="mode-text">
        <span class="mode-title">Classic</span>
        <span class="mode-description">Get clues on every try</span>
      </div>
    </button>

    <button class="infinite-mode-button" type="button"
            (click)="modeSelected.emit('infinite')"
            aria-label="Play Infinite Mode" title="Infinite Mode">
      <span class="infinite-symbol" aria-hidden="true">∞</span>
      <span class="infinite-label">Infinite</span>
    </button>
  </div>

  <button class="game-mode-item raid-mode-item" type="button" disabled
          aria-label="Raid mode coming soon">
    <div class="mode-image-wrap">
      <img src="main_commands/03_MainCommands/02/raid_finder.png"
           class="mode-image" height="48" width="48" alt="" />
    </div>
    <div class="mode-text">
      <span class="mode-title">Raid (coming soon)</span>
      <span class="mode-description">Guess the savage/ultimate raid</span>
    </div>
  </button>
</div>
