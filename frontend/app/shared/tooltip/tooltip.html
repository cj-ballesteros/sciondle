
<div class="relative inline-flex group">
    <ng-content />

    <div
            role="tooltip"
            class="pointer-events-none absolute bottom-full left-1/2 z-50
           mb-2 -translate-x-1/2
           min-w-max border border-gray-500/70
           bg-black/85 px-2 py-1.5
           font-sans text-sm text-gray-100
           shadow-[0_2px_6px_rgba(0,0,0,0.65)]
           opacity-0 transition-opacity duration-100
           group-hover:opacity-100 group-focus-within:opacity-100"
    >
        <ng-content select="[tooltip-text]" />
    </div>
</div>
