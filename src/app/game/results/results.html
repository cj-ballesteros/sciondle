<div class="mt-10 flex flex-col items-center text-center">
  <div class="bg-white shadow-lg rounded-2xl p-6 w-full max-w-lg flex flex-col items-center">

    <h2 class="text-3xl font-bold text-center mb-6">gg tyfp</h2>

    <div class="flex flex-col items-center sm:flex-row sm:items-start sm:space-x-6 space-x-6 text-center sm-text-left">
      <img
        [src]="'http://localhost:5000/' + correctAnswer.image_url"
        alt="{{ correctAnswer.name }}"
        class="w-40 h-40 object-cover rounded-xl shadow mb-4 sm:mb-0"
      />

      <p class="text-xl text-gray-800">
        You guessed <span class="font-semibold">{{ correctAnswer.name }}!</span>
      </p>
    </div>

    <p class="mt-4 text-lg text-gray-600">
      It took you {{ guesses.length }} tries.
    </p>

  </div>
</div>
