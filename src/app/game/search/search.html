<!--Using ng-option and for loop-->
<form (ngSubmit)="on_submit()">
<ng-select
  [items]="(characters$ | async) ?? []"
  bindLabel="name"
  bindValue="id"
  placeholder="Search characters"
  [typeahead]="searchInput$"
  [(ngModel)]="selected_character"
  name="character"
>

  <ng-template ng-option-tmp let-item="item">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded overflow-hidden border border-gray-300 flex-shrink-0">
        <img [src]="'http://localhost:5000/' + item.image_url" alt ="{{item.name}}" class="w-full h-full object-cover" />
      </div>
      <span>{{ item.name }}</span>
    </div>
  </ng-template>

</ng-select>
  <button type="submit">Submit</button>
</form>
